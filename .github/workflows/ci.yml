name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  core-tests:
    name: Pure-Kotlin core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No Android SDK on this runner, so settings.gradle.kts configures only the
      # pure-Kotlin core modules — exactly what we want to verify here.
      - name: Run core unit tests
        run: ./gradlew test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  # The Android app (:app, :core:design, :core:database) builds on a machine with
  # the Android SDK. Enable this job once the modules are compiling in your
  # environment; it is intentionally omitted from required checks until then.
