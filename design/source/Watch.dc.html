<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch: step by step</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background-color:#F3F5F9;background-image:radial-gradient(#D3DAE8 1px,transparent 1px);background-size:18px 18px;font-family:'Hanken Grotesk',sans-serif;color:#101B33">
  <div style="flex:1;min-height:0;padding:48px 20px 0;box-sizing:border-box;display:flex;flex-direction:column">
    <a href="Learn.dc.html" style="align-self:flex-start;min-height:44px;margin-left:-8px;padding:0 8px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font:600 15px/1 'Hanken Grotesk',sans-serif;color:#46546F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46546F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back to lesson</a>
    <div style="margin-top:2px;font:600 12px/1 'Hanken Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5B6781">Step {{num}} of 4</div>
    <h1 style="margin:10px 0 0;font:700 28px/1.1 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em">{{title}}</h1>

    <div style="margin-top:18px;background:#fff;border:1px solid #DCE2EC;border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:0">
      <sc-for list="{{nodes}}" as="n" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:12px;min-height:52px">
          <span style="width:36px;height:36px;border-radius:12px;background:{{n.bg}};border:2px solid {{n.bd}};display:flex;align-items:center;justify-content:center;flex:none;font:700 13px/1 'IBM Plex Mono',monospace;color:#101B33">{{n.i}}</span>
          <span style="flex:1;font:{{n.fw}} 16px/1.2 'Hanken Grotesk',sans-serif;color:{{n.c}}">{{n.t}}</span>
          <span style="font:500 13px/1 'IBM Plex Mono',monospace;color:#46546F">{{n.v}}</span>
        </div>
      </sc-for>
    </div>

    <p style="margin:16px 0 0;font:400 18px/1.5 'Hanken Grotesk',sans-serif;color:#101B33;min-height:108px">{{text}}</p>
  </div>

  <div style="flex:none;padding:12px 20px 30px;box-sizing:border-box;display:flex;gap:10px;align-items:center">
    <button type="button" aria-label="Previous step" style="width:54px;height:54px;border-radius:16px;border:1px solid #C9D1E0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer" onClick="{{prev}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#101B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <sc-if value="{{notLast}}" hint-placeholder-val="{{true}}">
      <button type="button" style="flex:1;height:54px;border-radius:16px;border:0;background:#101B33;color:#fff;font:600 16px/1 'Hanken Grotesk',sans-serif;cursor:pointer" onClick="{{next}}">Next step</button>
    </sc-if>
    <sc-if value="{{isLast}}" hint-placeholder-val="{{false}}">
      <a href="Try.dc.html" style="flex:1;height:54px;border-radius:16px;background:#101B33;color:#fff;text-decoration:none;font:600 16px/1 'Hanken Grotesk',sans-serif;display:flex;align-items:center;justify-content:center">Try a question</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { step: 0 };
  renderVals() {
    const s = this.state.step;
    const steps = [
      { title: 'Your phone asks', text: 'You type example.com. Your phone does not know the number yet, so it asks its resolver.' },
      { title: 'The resolver looks', text: 'The resolver checks its memory. If it has no answer, it asks a name server who owns example.com.' },
      { title: 'A number comes back', text: 'The name server replies with the IP address. The resolver passes it to your phone.' },
      { title: 'The page loads', text: 'Your phone connects to 203.0.113.7. The resolver remembers the answer for a while, so the next lookup is fast.' }
    ];
    const defs = [
      { i: '1', t: 'Your phone', v: 'example.com?' },
      { i: '2', t: 'Resolver', v: 'asking…' },
      { i: '3', t: 'Name server', v: '203.0.113.7' },
      { i: '4', t: 'Web server', v: 'page' }
    ];
    const nodes = defs.map((d, i) => ({
      i: d.i, t: d.t, v: i <= s ? d.v : '',
      bg: i === s ? '#FFE066' : (i < s ? '#DDF3EF' : '#F3F5F9'),
      bd: i === s ? '#101B33' : (i < s ? '#0F9D8A' : '#C9D1E0'),
      fw: i === s ? 700 : 500,
      c: i <= s ? '#101B33' : '#5B6781'
    }));
    return {
      num: s + 1,
      title: steps[s].title,
      text: steps[s].text,
      nodes: nodes,
      notLast: s < 3,
      isLast: s === 3,
      next: () => this.setState({ step: Math.min(3, s + 1) }),
      prev: () => this.setState({ step: Math.max(0, s - 1) })
    };
  }
}
</script>
</body>
</html>
